<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Binger</title>
  <meta name="description" content="Swipe through films, TV and anime. Rate what you watch and Binger gets better at picking what's next.">
  <meta name="theme-color" content="#0F0E13">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Binger">
  <link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/version.js"></script>
  <script type="module" src="js/app.js"></script>
  <!-- Every module the app imports, fetched at once instead of one import
       level at a time (a five-step chain took 3.7 s on a slow phone).
       tests/shell.test.js keeps this list complete. -->
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/engine/explain.js">
  <link rel="modulepreload" href="js/engine/features.js">
  <link rel="modulepreload" href="js/engine/index.js">
  <link rel="modulepreload" href="js/engine/profile.js">
  <link rel="modulepreload" href="js/engine/rank.js">
  <link rel="modulepreload" href="js/engine/score.js">
  <link rel="modulepreload" href="js/engine/seasons.js">
  <link rel="modulepreload" href="js/engine/timeline.js">
  <link rel="modulepreload" href="js/engine/together.js">
  <link rel="modulepreload" href="js/sources/anilist.js">
  <link rel="modulepreload" href="js/sources/candidates.js">
  <link rel="modulepreload" href="js/sources/genres.js">
  <link rel="modulepreload" href="js/sources/http.js">
  <link rel="modulepreload" href="js/sources/imports.js">
  <link rel="modulepreload" href="js/sources/lookups.js">
  <link rel="modulepreload" href="js/sources/ratings.js">
  <link rel="modulepreload" href="js/sources/services.js">
  <link rel="modulepreload" href="js/sources/tmdb.js">
  <link rel="modulepreload" href="js/state/cache.js">
  <link rel="modulepreload" href="js/state/device.js">
  <link rel="modulepreload" href="js/state/library.js">
  <link rel="modulepreload" href="js/state/profiles.js">
  <link rel="modulepreload" href="js/state/store.js">
  <link rel="modulepreload" href="js/sync/firebase.js">
  <link rel="modulepreload" href="js/sync/sync.js">
  <link rel="modulepreload" href="js/ui/card.js">
  <link rel="modulepreload" href="js/ui/deck.js">
  <link rel="modulepreload" href="js/ui/detail.js">
  <link rel="modulepreload" href="js/ui/dom.js">
  <link rel="modulepreload" href="js/ui/filters.js">
  <link rel="modulepreload" href="js/ui/gesture.js">
  <link rel="modulepreload" href="js/ui/import.js">
  <link rel="modulepreload" href="js/ui/library.js">
  <link rel="modulepreload" href="js/ui/onboarding.js">
  <link rel="modulepreload" href="js/ui/people.js">
  <link rel="modulepreload" href="js/ui/person.js">
  <link rel="modulepreload" href="js/ui/rate.js">
  <link rel="modulepreload" href="js/ui/search.js">
  <link rel="modulepreload" href="js/ui/services.js">
  <link rel="modulepreload" href="js/ui/settings.js">
  <link rel="modulepreload" href="js/ui/sheet.js">
  <link rel="modulepreload" href="js/ui/shortcuts.js">
  <link rel="modulepreload" href="js/ui/taste.js">
  <link rel="modulepreload" href="js/ui/timeline.js">
  <link rel="modulepreload" href="js/ui/trailer.js">
</head>
<body>
  <div class="app">
    <main id="view" class="view" data-tab="discover">
      <!-- Shown until the app draws its first screen, so a slow start is never a blank one. -->
      <div class="splash" role="status">
        <span class="brand"><span class="brand-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span><span class="brand-word">binger</span></span>
        <span class="splash-bar" aria-hidden="true"></span>
        <span class="sr-only">Loading Binger</span>
      </div>
    </main>
    <nav id="tabbar" class="tabbar" aria-label="Main">
      <a href="#discover" data-tab="discover" class="tab" aria-current="page">
        <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg></span>
        <span>Discover</span>
      </a>
      <a href="#library" data-tab="library" class="tab">
        <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="M16.5 5l3.8 1-4 15-3.8-1"/></svg></span>
        <span>Library</span>
      </a>
      <a href="#taste" data-tab="taste" class="tab">
        <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
        <span>Taste</span>
      </a>
      <!-- Settings from any page (the owner's ask): a sheet, not a tab of its own. -->
      <button type="button" id="settings-tab" class="tab tab-settings">
        <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
        <span>Settings</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast-host" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Binger needs JavaScript turned on.</p></noscript>
</body>
</html>
