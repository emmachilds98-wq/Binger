<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binger · Taste profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5B83D}a:hover{color:#FFD27A}
button,input{font-family:inherit}
input[type=range]{accent-color:#F5B83D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0E13; color: #F4F1EA; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; overflow: hidden; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.5px">Your taste</h1>
      <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </button>
    </div>

    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #D4CFDB">Learned from <strong style="color: #F4F1EA">42 ratings</strong> and <strong style="color: #F4F1EA">310 swipes</strong>. Recent ratings count most, so this shifts as you do.</p>

    <section aria-labelledby="g" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="g" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #ABA5B6">Pulls you in</h2>
      <sc-for list="{{genres}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 116px; font-size: 14px">{{g.name}}</div>
          <div style="flex: 1; height: 10px; border-radius: 5px; background: #24212C"><div style="{{g.bar}}"></div></div>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="ppl" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="ppl" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #ABA5B6">People you rate highly</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #1A1820; border: 1px solid #34303D">Denis Villeneuve</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #1A1820; border: 1px solid #34303D">Greta Gerwig</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #1A1820; border: 1px solid #34303D">Hayao Miyazaki</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #1A1820; border: 1px solid #34303D">Timothée Chalamet</span>
      </div>
    </section>

    <section aria-labelledby="mix" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: #1A1820">
      <h2 id="mix" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #ABA5B6">Steer the deck</h2>
      <sc-for list="{{mix}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px">
          <label for="{{m.id}}" style="width: 64px; font-size: 14px">{{m.label}}</label>
          <input id="{{m.id}}" type="range" min="0" max="100" value="{{m.value}}" onInput="{{m.change}}" style="flex: 1; min-height: 32px">
          <span style="width: 40px; text-align: right; font-size: 13px; color: #ABA5B6">{{m.pct}}</span>
        </div>
      </sc-for>
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
        <button role="switch" aria-checked="{{t.checked}}" onClick="{{t.flip}}" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 0; background: transparent; color: #F4F1EA; padding: 0; cursor: pointer; text-align: left">
          <span style="display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 600">{{t.label}}</span>
            <span style="font-size: 12px; color: #ABA5B6">{{t.hint}}</span>
          </span>
          <span style="{{t.track}}"><span style="{{t.knob}}"></span></span>
        </button>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Main" style="display: flex; border-top: 1px solid #24212C; padding: 6px 8px 20px; background: #0F0E13">
    <a href="Main.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ABA5B6; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M9 8l6 4-6 4z"></path></svg>
      Discover
    </a>
    <a href="Library.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ABA5B6; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4z"></path><path d="M16.5 5l3.8 1-4 15-3.8-1"></path></svg>
      Library
    </a>
    <a href="Taste.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #F5B83D; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      Taste
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mix: { films: 50, tv: 35, anime: 60 }, fresh: true, surprise: true };
  }
  renderVals() {
    const genres = [['Science Fiction', 92], ['Drama', 78], ['Fantasy', 64], ['Comedy', 41]].map(([name, v]) => ({
      name, bar: 'width: ' + v + '%; height: 10px; border-radius: 5px; background: #F5B83D'
    }));
    const m = this.state.mix;
    const total = m.films + m.tv + m.anime || 1;
    const mix = [['films', 'Films'], ['tv', 'TV'], ['anime', 'Anime']].map(([id, label]) => ({
      id: 'mix-' + id, label, value: m[id],
      pct: Math.round((m[id] / total) * 100) + '%',
      change: (e) => {
        const next = Object.assign({}, this.state.mix);
        next[id] = Number(e.target.value);
        this.setState({ mix: next });
      }
    }));
    const sw = (on) => ({
      track: 'width: 46px; height: 28px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; padding: 3px; box-sizing: border-box; background: ' + (on ? '#F5B83D' : '#34303D') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start'),
      knob: 'width: 22px; height: 22px; border-radius: 11px; background: ' + (on ? '#1A1407' : '#ABA5B6')
    });
    const toggles = [
      ['fresh', 'Favour new releases', 'Lift titles from the last 12 months'],
      ['surprise', 'Surprise me sometimes', 'About 1 card in 7 is outside your usual taste']
    ].map(([key, label, hint]) => Object.assign({ label, hint, checked: this.state[key] ? 'true' : 'false', flip: () => this.setState({ [key]: !this.state[key] }) }, sw(this.state[key])));
    return { genres, mix, toggles };
  }
}
</script>
</body>
</html>
