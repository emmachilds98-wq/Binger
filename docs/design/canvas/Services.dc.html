<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binger · Streaming services</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5B83D}a:hover{color:#FFD27A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0E13; color: #F4F1EA; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 16px 12px 8px 16px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.5px">Your services</h1>
    <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #F4F1EA; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 16px">
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #D4CFDB">Pick what you pay for. Binger lifts titles on these, and can hide everything else.</p>

    <div role="group" aria-label="Streaming services" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{services}}" as="s" hint-placeholder-count="12">
        <button aria-pressed="{{s.pressed}}" onClick="{{s.flip}}" style="{{s.tile}}">
          <span aria-hidden="true" style="{{s.mono}}">{{s.initial}}</span>
          <span style="font-size: 13px; font-weight: 600; line-height: 1.2; text-align: center">{{s.name}}</span>
          <sc-if value="{{s.on}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 11px; background: #F5B83D; color: #1A1407; display: flex; align-items: center; justify-content: center">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
            </span>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="padding: 4px 14px; border-radius: 18px; background: #1A1820">
      <button role="switch" aria-checked="{{onlyChecked}}" onClick="{{flipOnly}}" style="width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; background: transparent; color: #F4F1EA; padding: 0; text-align: left">
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 600">Only show what I can stream</span>
          <span style="font-size: 13px; color: #ABA5B6">{{onlyHint}}</span>
        </span>
        <span style="{{track}}"><span style="{{knob}}"></span></span>
      </button>
    </div>

    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #ABA5B6">Films and TV: what's included with a subscription in the United Kingdom, from JustWatch via TMDB. Rent and buy don't count. Anime: AniList's official streaming links, which aren't per country.</p>
  </div>

  <div style="display: flex; padding: 12px 16px 20px; border-top: 1px solid #24212C">
    <button style="flex: 1; min-height: 48px; border-radius: 24px; border: 0; background: #F5B83D; color: #1A1407; font-size: 15px; font-weight: 700">Done</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['Netflix', 'Crunchyroll', 'BBC iPlayer'], only: false };
  }
  renderVals() {
    const names = ['BBC iPlayer', 'Netflix', 'Amazon Prime Video', 'Disney+', 'NOW', 'Apple TV+', 'ITVX', 'Channel 4', 'Crunchyroll', 'HIDIVE', 'Paramount+', 'MUBI'];
    const picked = this.state.picked;
    const services = names.map((name) => {
      const on = picked.includes(name);
      return {
        name, on,
        initial: name.replace(/[^A-Za-z0-9]/g, '').slice(0, 1),
        pressed: on ? 'true' : 'false',
        flip: () => this.setState({ picked: on ? picked.filter((p) => p !== name) : picked.concat([name]) }),
        tile: 'position: relative; min-height: 96px; padding: 12px 6px 10px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #F4F1EA; background: ' + (on ? 'rgba(245,184,61,0.10)' : '#1A1820') + '; border: 1px solid ' + (on ? '#F5B83D' : '#34303D'),
        mono: 'width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: \'Bricolage Grotesque\', sans-serif; font-weight: 800; font-size: 17px; background: #34303D; color: #F4F1EA'
      };
    });
    const on = this.state.only;
    return {
      services,
      onlyChecked: on ? 'true' : 'false',
      onlyHint: on ? 'Everything else is hidden from your deck' : 'Off: your services are lifted, nothing is hidden',
      flipOnly: () => this.setState({ only: !on }),
      track: 'width: 46px; height: 28px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; padding: 3px; box-sizing: border-box; background: ' + (on ? '#F5B83D' : '#34303D') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start'),
      knob: 'width: 22px; height: 22px; border-radius: 11px; background: ' + (on ? '#1A1407' : '#ABA5B6')
    };
  }
}
</script>
</body>
</html>
