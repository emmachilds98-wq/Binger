<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binger · Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5B83D}a:hover{color:#FFD27A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0E13; color: #F4F1EA; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 22px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.5px">Library</h1>
      <button style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #34303D; background: #1A1820; color: #F4F1EA; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Log a watch
      </button>
    </div>
    <div role="tablist" aria-label="Library sections" style="display: flex; padding: 4px; border-radius: 14px; background: #1A1820">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{onWatchlist}}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{watchlist}}" as="w" hint-placeholder-count="5">
        <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: #1A1820">
          <div aria-hidden="true" style="{{w.thumb}}"></div>
          <div style="flex: 1; min-width: 0">
            <div style="font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.title}}</div>
            <div style="font-size: 13px; color: #ABA5B6">{{w.meta}}</div>
            <div style="font-size: 12px; color: #F5B83D; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.reason}}</div>
          </div>
          <a href="Rate.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 20px; background: #24212C; color: #7CC4FF; display: flex; align-items: center; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap">Watched it</a>
        </div>
      </sc-for>
    </sc-if>
    <sc-if value="{{onDiary}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{diary}}" as="d" hint-placeholder-count="4">
        <div style="display: flex; gap: 12px; padding: 12px; border-radius: 16px; background: #1A1820">
          <div aria-hidden="true" style="{{d.thumb}}"></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; justify-content: space-between; gap: 8px">
              <div style="font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.title}}</div>
              <div style="font-size: 12px; color: #ABA5B6; white-space: nowrap">{{d.date}}</div>
            </div>
            <div style="font-size: 14px; color: #F5B83D; letter-spacing: 1px" aria-label="{{d.starsLabel}}">{{d.stars}}</div>
            <div style="font-size: 13px; color: #D4CFDB; line-height: 1.35">{{d.review}}</div>
            <div style="font-size: 12px; color: #ABA5B6">{{d.tags}}</div>
          </div>
        </div>
      </sc-for>
    </sc-if>
  </div>

  <nav aria-label="Main" style="display: flex; border-top: 1px solid #24212C; padding: 6px 8px 20px; background: #0F0E13">
    <a href="Main.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ABA5B6; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M9 8l6 4-6 4z"></path></svg>
      Discover
    </a>
    <a href="Library.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #F5B83D; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4z"></path><path d="M16.5 5l3.8 1-4 15-3.8-1"></path></svg>
      Library
    </a>
    <a href="Taste.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ABA5B6; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      Taste
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'Watchlist' };
  }
  renderVals() {
    const thumb = (c) => 'width: 52px; height: 74px; border-radius: 8px; flex-shrink: 0; background: ' + c;
    const watchlist = [
      { title: 'Dune: Part Two', meta: 'Film · 2h 46m', reason: 'Same director as Arrival', c: '#7A4A26' },
      { title: 'Severance', meta: 'TV · 2 seasons', reason: 'Because you rated Black Mirror 5★', c: '#2B3F5C' },
      { title: 'Frieren: Beyond Journey’s End', meta: 'Anime · 28 episodes', reason: 'Fantasy + Slice of Life', c: '#2F5E5A' },
      { title: 'The Bear', meta: 'TV · Comedy-drama', reason: 'You added it yourself', c: '#5C3A2B' },
      { title: 'Past Lives', meta: 'Film · 1h 46m', reason: 'Moving, a tag you use often', c: '#4A4A6B' }
    ].map((w) => Object.assign({}, w, { thumb: thumb(w.c) }));
    const diary = [
      { title: 'Arrival', date: '12 Oct', r: 5, review: 'Still the best first-contact film. The ending rewires the whole thing.', tags: 'Clever · Moving', c: '#3C4A57' },
      { title: 'Spirited Away', date: '5 Oct', r: 4.5, review: 'Rewatch. The bathhouse is still the best world in any film.', tags: 'Beautiful · Comfort watch', c: '#6B3A4A' },
      { title: 'Little Women', date: '28 Sep', r: 4.5, review: 'Cried at the beach scene again.', tags: 'Moving', c: '#6A4B3A' },
      { title: 'Tenet', date: '20 Sep', r: 2.5, review: 'Looked great, could not follow it.', tags: 'Confusing · Overhyped', c: '#2E3340' }
    ].map((d) => Object.assign({}, d, {
      thumb: thumb(d.c),
      stars: '★'.repeat(Math.floor(d.r)) + (d.r % 1 ? '½' : ''),
      starsLabel: d.r + ' out of 5 stars'
    }));
    const tab = this.state.tab;
    const tabs = [['Watchlist', 'Watchlist · 18'], ['Diary', 'Diary · 42']].map(([key, label]) => {
      const on = tab === key;
      return {
        label,
        selected: on ? 'true' : 'false',
        pick: () => this.setState({ tab: key }),
        style: 'flex: 1; min-height: 40px; border: 0; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; background: ' + (on ? '#34303D' : 'transparent') + '; color: ' + (on ? '#F4F1EA' : '#ABA5B6')
      };
    });
    return { tabs, watchlist, diary, onWatchlist: tab === 'Watchlist', onDiary: tab === 'Diary' };
  }
}
</script>
</body>
</html>
