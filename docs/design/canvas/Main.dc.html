<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binger · Discover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5B83D}a:hover{color:#FFD27A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0E13; color: #F4F1EA; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="8" fill="#F5B83D"></rect><path d="M10 8 L18 13 L10 18 Z" fill="#0F0E13"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.5px">binger</span>
      </div>
      <div style="display: flex; gap: 4px">
        <button aria-label="Search" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        </button>
        <button aria-label="Deck filters" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
        </button>
      </div>
    </div>
    <div role="group" aria-label="What to show" style="display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; padding: 4px 16px 0; display: flex; flex-direction: column; min-height: 0">
    <article style="flex: 1; border-radius: 28px; background: #1A1820; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 48px rgba(0,0,0,0.45); position: relative">
      <div style="{{card.artStyle}}">
        <div style="position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center">
          <span style="{{card.badgeStyle}}">{{card.type}}</span>
          <span style="background: rgba(15,14,19,0.72); color: #F4F1EA; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px">{{card.match}} match</span>
        </div>
        <div style="position: absolute; top: 70px; left: 0; right: 0; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: rgba(244,241,234,0.55)">Poster art · {{card.artSource}}</div>
        <button onClick="{{toggleClip}}" aria-label="Play 30 second trailer clip" style="position: absolute; top: 118px; left: 50%; margin-left: -34px; width: 68px; height: 68px; border-radius: 34px; border: 2px solid rgba(244,241,234,0.85); background: rgba(15,14,19,0.55); color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <sc-if value="{{clipOn}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: flex-end">
            <div style="position: absolute; top: 50%; left: 0; right: 0; text-align: center; margin-top: -10px; font-size: 14px; color: #ABA5B6">Trailer clip · plays muted, tap for sound</div>
            <div style="padding: 0 14px 14px; display: flex; align-items: center; gap: 10px">
              <button onClick="{{toggleClip}}" aria-label="Stop clip" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: rgba(244,241,234,0.15); color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>
              </button>
              <div style="flex: 1; height: 4px; background: rgba(244,241,234,0.2); border-radius: 2px"><div style="width: 40%; height: 4px; background: #F5B83D; border-radius: 2px"></div></div>
              <span style="font-size: 12px; color: #ABA5B6">0:12 / 0:30</span>
            </div>
          </div>
        </sc-if>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 18px 14px; background: linear-gradient(180deg, rgba(26,24,32,0) 0%, rgba(26,24,32,0.92) 55%, #1A1820 100%)">
          <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.5px">{{card.title}}</h1>
          <div style="margin-top: 6px; font-size: 14px; color: #D4CFDB">{{card.meta}}</div>
        </div>
      </div>

      <div style="padding: 4px 18px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="align-self: flex-start; display: flex; align-items: center; gap: 6px; background: rgba(245,184,61,0.12); color: #F5B83D; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.8 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
          {{card.reason}}
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #D4CFDB">{{card.synopsis}}</p>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #ABA5B6">{{card.castLabel}}</div>
          <div style="display: flex; gap: 10px">
            <sc-for list="{{card.cast}}" as="p" hint-placeholder-count="3">
              <div style="flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0">
                <div style="{{p.avatarStyle}}">{{p.initials}}</div>
                <div style="min-width: 0">
                  <div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</div>
                  <div style="{{p.knownStyle}}">{{p.known}}</div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </article>
  </main>

  <div style="padding: 14px 16px 10px; display: flex; align-items: center; justify-content: center; gap: 18px">
    <button onClick="{{undo}}" aria-label="Undo last swipe" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #34303D; background: #1A1820; color: #ABA5B6; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
    </button>
    <button onClick="{{pass}}" aria-label="Pass" style="width: 64px; height: 64px; border-radius: 32px; border: 1px solid #34303D; background: #24212C; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <a href="Rate.dc.html" aria-label="Seen it — rate it" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid #34303D; background: #24212C; color: #7CC4FF; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </a>
    <button onClick="{{want}}" aria-label="Want to watch" style="width: 64px; height: 64px; border-radius: 32px; border: 0; background: #F5B83D; color: #1A1407; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </button>
    <a href="Detail.dc.html" aria-label="More about this title" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #34303D; background: #1A1820; color: #ABA5B6; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
    </a>
  </div>

  <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: #F4F1EA; color: #0F0E13; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px; white-space: nowrap">{{toast}}</div>
  </sc-if>

  <nav aria-label="Main" style="display: flex; border-top: 1px solid #24212C; padding: 6px 8px 20px; background: #0F0E13">
    <a href="Main.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #F5B83D; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M9 8l6 4-6 4z"></path></svg>
      Discover
    </a>
    <a href="Library.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ABA5B6; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4z"></path><path d="M16.5 5l3.8 1-4 15-3.8-1"></path></svg>
      Library
    </a>
    <a href="Taste.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ABA5B6; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      Taste
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0, filter: 'All', clipOn: false, toast: '' };
  }
  cards() {
    return [
      {
        title: 'Dune: Part Two', type: 'Film', match: '94%', artSource: 'TMDB',
        meta: '2024 · 2h 46m · Sci-fi, Adventure', artColor: '#7A4A26',
        reason: 'Same director as Arrival, which you rated 5★',
        synopsis: 'Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family.',
        castLabel: 'People you know',
        cast: [
          { name: 'Timothée Chalamet', known: 'You loved: Little Women', you: true },
          { name: 'Zendaya', known: 'You watched: Euphoria', you: true },
          { name: 'Austin Butler', known: 'Feyd-Rautha', you: false }
        ]
      },
      {
        title: 'Frieren: Beyond Journey’s End', type: 'Anime', match: '91%', artSource: 'AniList',
        meta: '2023 · 28 episodes · Madhouse', artColor: '#2F5E5A',
        reason: 'Fantasy and Slice of Life, your top anime tags',
        synopsis: 'After the heroes defeat the Demon King, the elf mage Frieren outlives her companions and sets out to understand the people she barely got to know.',
        castLabel: 'Main voices',
        cast: [
          { name: 'Atsumi Tanezaki', known: 'Frieren', you: false },
          { name: 'Kana Ichinose', known: 'Fern', you: false },
          { name: 'Chiaki Kobayashi', known: 'Stark', you: false }
        ]
      },
      {
        title: 'Severance', type: 'TV', match: '88%', artSource: 'TMDB',
        meta: 'Series · Apple TV+ · Thriller, Mystery', artColor: '#2B3F5C',
        reason: 'Because you rated Black Mirror 5★',
        synopsis: 'Mark leads a team of office workers whose memories have been surgically divided between their work and personal lives.',
        castLabel: 'People you know',
        cast: [
          { name: 'Adam Scott', known: 'You loved: Parks and Rec', you: true },
          { name: 'John Turturro', known: 'You watched: The Batman', you: true },
          { name: 'Britt Lower', known: 'Helly R.', you: false }
        ]
      }
    ];
  }
  advance(msg) {
    const n = this.cards().length;
    this.setState({ idx: (this.state.idx + 1) % n, clipOn: false, toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: '' }), 1400);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const badge = { Film: '#F5B83D', TV: '#7CC4FF', Anime: '#FF9BC2' };
    const c = this.cards()[this.state.idx];
    const initials = (name) => name.split(' ').map((w) => w[0]).slice(0, 2).join('');
    const card = Object.assign({}, c, {
      artStyle: 'position: relative; height: 372px; flex-shrink: 0; background: ' + c.artColor,
      badgeStyle: 'background: ' + badge[c.type] + '; color: #0F0E13; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 10px; border-radius: 999px',
      cast: c.cast.map((p) => Object.assign({}, p, {
        initials: initials(p.name),
        avatarStyle: 'width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #34303D; color: #F4F1EA; box-shadow: ' + (p.you ? '0 0 0 2px #F5B83D' : 'none'),
        knownStyle: 'font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (p.you ? '#F5B83D' : '#ABA5B6')
      }))
    });
    const filters = ['All', 'Films', 'TV', 'Anime'].map((label) => {
      const on = this.state.filter === label;
      return {
        label,
        pick: () => this.setState({ filter: label }),
        style: 'min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid ' + (on ? '#F4F1EA' : '#34303D') + '; background: ' + (on ? '#F4F1EA' : 'transparent') + '; color: ' + (on ? '#0F0E13' : '#D4CFDB')
      };
    });
    return {
      card,
      filters,
      clipOn: this.state.clipOn,
      toggleClip: () => this.setState({ clipOn: !this.state.clipOn }),
      toastOn: !!this.state.toast,
      toast: this.state.toast,
      pass: () => this.advance('Passed. Binger will show less like this'),
      want: () => this.advance('Added to your Watchlist'),
      undo: () => {
        const n = this.cards().length;
        this.setState({ idx: (this.state.idx + n - 1) % n, clipOn: false, toast: 'Undone' });
      }
    };
  }
}
</script>
</body>
</html>
