<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binger · Deck filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5B83D}a:hover{color:#FFD27A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0E13; color: #F4F1EA; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="8" fill="#F5B83D"></rect><path d="M10 8 L18 13 L10 18 Z" fill="#0F0E13"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.5px">binger</span>
      </div>
      <div style="display: flex; gap: 4px">
        <button aria-label="Search" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #F4F1EA; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        </button>
        <button aria-label="Deck filters (on)" style="position: relative; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #24212C; color: #F4F1EA; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
          <span aria-hidden="true" style="position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 4px; background: #F5B83D; box-shadow: 0 0 0 2px #24212C"></span>
        </button>
        <button aria-label="Fresh cards" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #F4F1EA; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
        </button>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <span style="min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; display: flex; align-items: center; border: 1px solid #F4F1EA; background: #F4F1EA; color: #0F0E13">All</span>
      <span style="min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; display: flex; align-items: center; border: 1px solid #34303D; color: #D4CFDB">Films</span>
      <span style="min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; display: flex; align-items: center; border: 1px solid #34303D; color: #D4CFDB">TV</span>
      <span style="min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; display: flex; align-items: center; border: 1px solid #34303D; color: #D4CFDB">Anime</span>
    </div>
    <sc-if value="{{hasSummary}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: #ABA5B6">
        <span>{{summary}}</span>
        <button onClick="{{clear}}" style="border: 0; background: none; padding: 6px 0; color: #F5B83D; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Clear</button>
      </div>
    </sc-if>
  </header>

  <main style="flex: 1; padding: 4px 16px 0; display: flex; flex-direction: column; min-height: 0">
    <div aria-hidden="true" style="flex: 1; border-radius: 28px; background: #3B2A3F; position: relative; overflow: hidden">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 18px 18px; background: linear-gradient(180deg, rgba(26,24,32,0) 0%, #1A1820 80%)">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px">Perfect Blue</div>
        <div style="font-size: 14px; color: #D4CFDB">1998 · Anime film · 1h 21m</div>
      </div>
    </div>
  </main>
  <div style="height: 90px"></div>
  <nav aria-label="Main" style="height: 78px; border-top: 1px solid #24212C"></nav>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,4,8,0.6)"></div>

  <section role="dialog" aria-label="Filters" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: #1A1820; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #34303D"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Filters</h2>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #F4F1EA; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div id="f-len" style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #ABA5B6">Length</div>
      <div role="group" aria-labelledby="f-len" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{lengths}}" as="o" hint-placeholder-count="2">
          <button aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; color: #ABA5B6">Quick watches: films up to 2 hours, series up to 13 episodes.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div id="f-dec" style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #ABA5B6">Released</div>
      <div role="group" aria-labelledby="f-dec" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{decades}}" as="o" hint-placeholder-count="7">
          <button aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #ABA5B6">Where</div>
      <button role="switch" aria-checked="{{streamChecked}}" onClick="{{flipStream}}" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; background: transparent; color: #F4F1EA; padding: 0; text-align: left">
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 600">Only what I can stream</span>
          <span style="font-size: 13px; color: #ABA5B6">On Netflix, Crunchyroll and BBC iPlayer</span>
        </span>
        <span style="{{track}}"><span style="{{knob}}"></span></span>
      </button>
    </div>

    <div style="display: flex; gap: 10px">
      <button onClick="{{clear}}" style="min-height: 48px; padding: 0 18px; border-radius: 24px; border: 1px solid #34303D; background: #24212C; color: #F4F1EA; font-size: 15px; font-weight: 700">Reset</button>
      <button style="flex: 1; min-height: 48px; border-radius: 24px; border: 0; background: #F5B83D; color: #1A1407; font-size: 15px; font-weight: 700">Show cards</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { short: true, decade: '1990s', stream: true };
  }
  renderVals() {
    const pill = (on) => 'min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; border: 1px solid ' + (on ? '#F5B83D' : '#34303D') + '; background: ' + (on ? 'rgba(245,184,61,0.12)' : 'transparent') + '; color: ' + (on ? '#F5B83D' : '#D4CFDB');
    const s = this.state;
    const lengths = [[false, 'Any length'], [true, 'Quick watches']].map(([v, label]) => ({
      label, pressed: s.short === v ? 'true' : 'false', style: pill(s.short === v), pick: () => this.setState({ short: v })
    }));
    const decades = ['Any time', '2020s', '2010s', '2000s', '1990s', '1980s', 'Older'].map((label) => ({
      label, pressed: s.decade === label ? 'true' : 'false', style: pill(s.decade === label), pick: () => this.setState({ decade: label })
    }));
    const bits = [];
    if (s.short) bits.push('Quick watches');
    if (s.decade !== 'Any time') bits.push(s.decade);
    if (s.stream) bits.push('On your services');
    return {
      lengths, decades,
      summary: bits.join(' · '),
      hasSummary: bits.length > 0,
      clear: () => this.setState({ short: false, decade: 'Any time', stream: false }),
      streamChecked: s.stream ? 'true' : 'false',
      flipStream: () => this.setState({ stream: !s.stream }),
      track: 'width: 46px; height: 28px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; padding: 3px; box-sizing: border-box; background: ' + (s.stream ? '#F5B83D' : '#34303D') + '; justify-content: ' + (s.stream ? 'flex-end' : 'flex-start'),
      knob: 'width: 22px; height: 22px; border-radius: 11px; background: ' + (s.stream ? '#1A1407' : '#ABA5B6')
    };
  }
}
</script>
</body>
</html>
